name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel older runs on the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test (macOS)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app

      - name: Show Swift version
        run: swift --version

      - name: Cache SwiftPM build artefacts
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build
        run: swift build -c debug

      - name: Test
        run: swift test --parallel

  build-release:
    name: Universal release build
    runs-on: macos-14
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app

      - name: Build universal .app
        run: ./scripts/build_app.sh

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: PhotosArchiveExporter-macos-universal
          path: dist/PhotosArchiveExporter-*.zip
          if-no-files-found: error
          retention-days: 14
